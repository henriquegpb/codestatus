name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Two independent jobs publishing into one release. The Windows installer does
  # not need a Mac and the disk image does not need a Windows runner, and making
  # either wait for the other would double the time to a release for no reason.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [[ -z "$VERSION" ]] && VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The whole suite, including the transport integration test, which starts
      # a real daemon on a real named pipe. Nothing ships that has not had the
      # privacy assertion run against the bytes on the wire.
      - name: Test
        run: npm test

      # The version in package.json is what electron-builder stamps into the
      # installer and the executable, so it has to match the tag rather than
      # whatever was last committed.
      - name: Stamp the version
        shell: bash
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # Unsigned, for now. A Windows installer without an Authenticode
      # certificate gets a SmartScreen warning on first run, and the site says
      # so rather than letting people meet it unwarned. Add CSC_LINK and
      # CSC_KEY_PASSWORD here when there is a certificate to add.
      - name: Build the installer
        run: npm run dist

      # A stable name for the website to link, alongside the versioned one that
      # is the historical record. `/releases/latest/download/<name>` needs a
      # filename that does not change with the version.
      - name: Duplicate under stable names
        shell: bash
        run: |
          cd dist
          cp "CodeStatus-Setup-${{ steps.version.outputs.value }}-x64.exe" CodeStatus-Setup.exe
          cp "CodeStatus-Setup-${{ steps.version.outputs.value }}-arm64.exe" CodeStatus-Setup-arm64.exe

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/CodeStatus-Setup-${{ steps.version.outputs.value }}-x64.exe
            windows/dist/CodeStatus-Setup-${{ steps.version.outputs.value }}-arm64.exe
            windows/dist/CodeStatus-Setup.exe
            windows/dist/CodeStatus-Setup-arm64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  release:
    # Pinned to the toolchain the project is developed against. macos-15 images
    # ship a much older Xcode, and building on a different compiler than we ship
    # means CI is testing something other than the product -- which is how the
    # first red build here happened.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [[ -z "$VERSION" ]] && VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      # Secrets required, configured once in repository settings:
      #   SIGNING_CERTIFICATE_P12   base64 of the Developer ID Application .p12
      #   SIGNING_CERTIFICATE_PASSWORD
      #   SIGNING_IDENTITY          e.g. "Developer ID Application: Name (TEAMID)"
      #   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)
      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build signed universal app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/build-app.sh --sign "${{ secrets.SIGNING_IDENTITY }}"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # Notarization takes a zip; the ticket is stapled to the .app itself,
          # and the .dmg is built afterwards so it carries a stapled bundle.
          ditto -c -k --keepParent dist/CodeStatus.app "$RUNNER_TEMP/CodeStatus.zip"
          xcrun notarytool submit "$RUNNER_TEMP/CodeStatus.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple dist/CodeStatus.app
          xcrun stapler validate dist/CodeStatus.app
          spctl --assess --type execute --verbose=4 dist/CodeStatus.app

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.value }}
          # The image is signed too, not just the app inside it: a ticket can
          # only be stapled to a signed artifact, so without this the staple
          # below fails with error 65.
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: scripts/make-dmg.sh "$VERSION"

      - name: Notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG="dist/CodeStatus-${{ steps.version.outputs.value }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

      # Two names for one image. The versioned copy is the historical record;
      # the unversioned one gives the website a URL that does not change every
      # release, since `/releases/latest/download/<name>` needs a fixed name.
      - name: Duplicate the image under a stable name
        run: cp "dist/CodeStatus-${{ steps.version.outputs.value }}.dmg" dist/CodeStatus.dmg

      # What the in-app updater downloads. A zip rather than the image the
      # website links to, because unpacking one is a single `ditto` call while a
      # .dmg needs attach and detach -- two more ways for a self-update to fail
      # halfway. Built from the stapled bundle, so the copy the updater verifies
      # carries its notarization ticket offline.
      - name: Build the update archive
        run: ditto -c -k --keepParent dist/CodeStatus.app dist/CodeStatus.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodeStatus-${{ steps.version.outputs.value }}.dmg
            dist/CodeStatus.dmg
            dist/CodeStatus.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
