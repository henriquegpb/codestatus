name: Desktop

# The Electron app is a separate deliverable from the macOS one: different
# language, different runtime, nothing shared at build time. It gets its own
# workflow so a change to either cannot burn a runner for the other.
#
# One app, two platforms, and the matrix is the point rather than a convenience.
# Almost everything in src/platform/ is a pure function or a filesystem call, so
# both seams are exercised on whichever runner is running — and each runner then
# proves the one thing only it can, which is that the transport and the hook
# chain are reachable on the kernel underneath.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The unit suites need nothing installed: they are plain Node against
      # source with no dependencies, which is the point of keeping src/core/
      # free of the operating system and of Electron. The installer suite runs
      # twice on each runner, once per platform seam.
      - name: Unit tests
        run: npm run test:unit

      # Needs Electron, which is the only dependency in the project and is
      # ~370 MB. Installed after the cheap suites have already had their say.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The transport suite starts a real daemon and runs the hook the way
      # Claude Code would. It is the only place the privacy guarantee is checked
      # against the bytes on the wire rather than in the abstract, and the only
      # place the production invocation chain is executed rather than asserted:
      # cmd.exe and the generated shim on Windows, /usr/bin/env on Linux.
      - name: Transport integration test
        run: npm run test:transport

  structure:
    # Claims about how the app is put together, rather than about what it does.
    # One runner is enough: none of them depend on the operating system.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The macOS side asserts the hook binary does not link Foundation. The
      # equivalent structural claim here is that the hook stands alone: Claude
      # Code spawns it by absolute path, and it has to keep working when the
      # rest of the install is half-updated or broken.
      - name: Assert the hook has no imports from the app
        run: |
          if grep -nE "require\((['\"])\.\." hook/hook.js; then
            echo "hook.js imports from the app tree; see the note at the top of the file"
            exit 1
          fi

      # The seam is the thing that keeps a third platform cheap, and it only
      # holds while nothing outside src/platform/ knows which one it is on.
      # A process.platform check in the daemon, the installer or the core is how
      # that erodes — one branch at a time, each reasonable on its own.
      #
      # src/main.js is exempt: it draws the tray and the windows, and those
      # genuinely differ. The list is deliberately short so that adding to it is
      # a decision somebody makes rather than a thing that happens.
      - name: Assert the platform seam is not leaking
        run: |
          offenders=$(grep -rn "process\.platform" src/core src/daemon src/install || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "these belong behind src/platform/, not in the platform-free tree"
            exit 1
          fi

      # No dependency may be added without a deliberate change here. Electron is
      # the one exception, and it is a devDependency: nothing third-party ends
      # up in the running app's own code path.
      - name: Assert there are no runtime dependencies
        run: |
          if node -e "process.exit(require('./package.json').dependencies ? 1 : 0)"; then
            echo "no runtime dependencies"
          else
            echo "a runtime dependency was added"
            exit 1
          fi

  package:
    # Builds the Linux packages on every push, not only on a tag.
    #
    # The first tagged release of the Linux build failed here, and failed in the
    # most ordinary way possible: fpm needs a maintainer and a homepage for a
    # .deb, which NSIS never asked for, so nothing had ever supplied them. The
    # release published the macOS and Windows artifacts anyway and left the
    # website pointing at a .deb that did not exist.
    #
    # A packaging step that only ever runs during a release is a packaging step
    # whose failures are all discovered in public. This one runs first, and the
    # artifacts it leaves are also the answer to "send me a build to try"
    # without cutting a release to do it.
    #
    # macOS cannot stand in: electron-builder's bundled fpm for Mac is from 2015
    # and writes a 96-byte file it calls a .deb, reporting success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the packages
        run: npm run dist:linux

      # Asserts they are packages rather than files with the right extension,
      # which is exactly the shape the local build produced. dpkg-deb reads the
      # control archive, so it fails on anything that is not really a .deb, and
      # the size floor catches a package that unpacked to nothing.
      - name: Assert the packages are real
        run: |
          cd dist
          ls -la
          for f in *.deb; do
            echo "== $f"
            dpkg-deb -I "$f"
            size=$(stat -c%s "$f")
            [ "$size" -gt 40000000 ] || { echo "$f is only $size bytes"; exit 1; }
          done
          for f in *.rpm; do
            echo "== $f"
            rpm -qip "$f"
          done

      # The .deb names the file Claude Code will be told to run, so it has to be
      # in the package rather than merely in the repository. Silence here is the
      # failure this whole app is built to avoid.
      - name: Assert the hook shipped inside the package
        run: |
          cd dist
          deb=$(ls *-amd64.deb | head -1)
          dpkg-deb -c "$deb" | grep -E "resources/hook/hook\.js$" \
            || { echo "hook.js is not in the package"; exit 1; }
          dpkg-deb -c "$deb" | grep -E "/opt/CodeStatus/codestatus$" \
            || { echo "the executable is not where the hook entry will point"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
          retention-days: 30
  smoke:
    # Installs the .deb and drives the installed app, on the operating system it
    # is for. Everything before this proves the parts; this is the only place the
    # product is started.
    #
    # It exists because the whole port shipped without anyone ever launching it
    # on Linux. The parts were tested exhaustively and the premise -- an app that
    # sits in a tray and tells you when an agent needs you -- had never once run.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages

      # xvfb is the display, dbus the session bus a tray icon is published on,
      # and libayatana-appindicator3 the library Electron needs to publish one.
      # xdotool is what the app shells out to when a session is clicked.
      - name: Install a desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libayatana-appindicator3-1 xdotool x11-utils xterm

      # The real thing: apt resolves the dependencies electron-builder declared,
      # against a machine that has none of them yet.
      - name: Install the package
        working-directory: packages
        run: |
          deb=$(ls *-amd64.deb | head -1)
          sudo apt-get install -y "./$deb"
          test -x /opt/CodeStatus/codestatus
          test -f /opt/CodeStatus/resources/hook/hook.js
          ls /usr/share/applications/ | grep -i codestatus

      # Writes the hook entries naming the *installed* paths, then reads back
      # exactly what went into settings.json. Nothing below is written by this
      # script: the command and the argument vector are the ones the app chose.
      - name: Connect the hooks, as the app would
        env:
          CODESTATUS_HOOK_RUNTIME: /opt/CodeStatus/codestatus
          CODESTATUS_HOOK_SCRIPT: /opt/CodeStatus/resources/hook/hook.js
        run: |
          node -e "require('./src/install/claude').install()"
          node -e "
            const s = require(require('os').homedir() + '/.claude/settings.json');
            const h = s.hooks.SessionStart[0].hooks[0];
            if (h.async !== true) { console.error('not async'); process.exit(1); }
            require('fs').writeFileSync('/tmp/invocation.json', JSON.stringify(h));
            console.log(h.command, h.args.join(' '));
          "

      # The app itself, under a display and a session bus, as a user would.
      - name: Launch the app
        run: |
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            /opt/CodeStatus/codestatus --no-sandbox > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          # Past the four periodic timers, one of which once crashed the app
          # four seconds into every launch.
          for i in $(seq 1 30); do
            [ -S "$HOME/.local/share/CodeStatus/run/daemon.sock" ] && break
            sleep 1
          done
          sleep 12
          pgrep -f "/opt/CodeStatus/codestatus" > /dev/null \
            || { echo "the app died"; cat /tmp/app.log; exit 1; }
          echo "still running after the timers fired"

      - name: Assert it set itself up
        run: |
          run="$HOME/.local/share/CodeStatus/run"
          test -S "$run/daemon.sock" || { echo "no socket"; cat /tmp/app.log; exit 1; }
          [ "$(stat -c%a "$run/daemon.sock")" = "600" ] || { echo "socket is $(stat -c%a "$run/daemon.sock")"; exit 1; }
          [ "$(stat -c%a "$HOME/.local/share/CodeStatus/state")" = "700" ] || exit 1
          [ "$(cat "$run/pipe-name")" = "$run/daemon.sock" ] || { echo "pointer disagrees"; exit 1; }
          echo "socket 0600, dirs 0700, pointer agrees"

      # The whole point. An event goes in through the exact chain Claude Code
      # will use -- /usr/bin/env, the installed binary as a Node interpreter, the
      # installed hook -- and has to come out as a session in the running app.
      - name: Deliver an event through the installed chain
        run: |
          node -e "
            const { spawn } = require('child_process');
            const inv = require('/tmp/invocation.json');
            const child = spawn(inv.command, inv.args, { stdio: ['pipe', 'inherit', 'inherit'] });
            child.on('exit', (c) => process.exit(c === 0 ? 0 : 1));
            child.stdin.end(JSON.stringify({
              hook_event_name: 'SessionStart',
              session_id: 'smoke-test-session',
              cwd: process.cwd(),
              prompt: 'SECRET-MUST-NOT-PERSIST',
            }));
          "
          # The registry persists on a 1.5s debounce.
          for i in $(seq 1 20); do
            grep -q "smoke-test-session" "$HOME/.local/share/CodeStatus/state/sessions.json" 2>/dev/null && break
            sleep 1
          done
          snapshot="$HOME/.local/share/CodeStatus/state/sessions.json"
          grep -q "smoke-test-session" "$snapshot" \
            || { echo "the event never reached the app"; cat /tmp/app.log; ls -la "$HOME/.local/share/CodeStatus/run/spool"; exit 1; }
          grep -q "SECRET" "$snapshot" && { echo "content leaked into the snapshot"; exit 1; }
          echo "the session arrived, and carried no content with it"

      # Raising a window is the one capability Linux may not have. Under Xvfb
      # this is X11, so it is the path that can work -- and if xdotool cannot
      # find a window by pid here, it cannot on a user's X11 session either.
      - name: Raise a window by pid
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 & sleep 2
          xterm -e "sleep 60" & xt=$!
          sleep 3
          node -e "
            const { focusProcessWindow, focusCapability } = require('./src/platform/linux/focus');
            console.log('capability:', JSON.stringify(focusCapability()));
            focusProcessWindow($xt, (ok) => {
              console.log('raised:', ok);
              process.exit(ok ? 0 : 1);
            });
          "

      - name: Stop the app
        if: always()
        run: |
          pkill -f "/opt/CodeStatus/codestatus" || true
          echo "--- app log ---"; cat /tmp/app.log || true
