<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
<title>CodeStatus</title>
<link rel="stylesheet" href="fluent.css" />
<link rel="stylesheet" href="hud.css" />
</head>
<body>
  <div class="surface" id="surface">
    <!-- What the macOS menu bar shows outright. The Windows tray fits one
         number, so the full breakdown has to live at the top of the popover. -->
    <header class="summary" id="summary"></header>

    <!-- The inner wrapper is what gets measured. Measuring the scroller itself
         cannot work: once the window is taller than the content, its
         scrollHeight is its own height, so the popover could grow but never
         shrink again. -->
    <div class="body" id="body"><div class="body-inner" id="bodyInner"></div></div>

    <footer class="footer">
      <button class="footer-button" id="refresh" title="Re-scan for agent sessions">
        <span class="glyph" aria-hidden="true">&#xE72C;</span><span>Refresh</span>
      </button>
      <button class="footer-button" id="settings">
        <span class="glyph" aria-hidden="true">&#xE713;</span><span>Settings</span>
      </button>
      <span class="spacer"></span>
      <button class="footer-button" id="quit">
        <span class="glyph" aria-hidden="true">&#xE7E8;</span><span>Quit</span>
      </button>
    </footer>
  </div>
  <script src="hud.js"></script>
</body>
</html>
